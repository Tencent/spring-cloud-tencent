server:
  port: 48090
spring:
  application:
    name: LosslessCalleeService
  cloud:
    polaris:
      address: grpc://119.91.66.223:8091
      namespace: default
      enabled: true
      discovery:
        enabled: true
        register: true
      contract:
        exposure: true
        report:
          enabled: true
      admin:
        port: 28084
      stat:
        enabled: true
      lossless:
        enabled: true
        offline-callback-enabled: true
        offline-callback-timeout: 10000
        offline-callback-total-timeout: 20000
        offline-callback-failure-mode: continue
        #healthCheckPath: /actuator/health
        #healthCheckInterval: 5000
lossless:
  healthy:
    delay:
      second: 20
management:
  endpoints:
    web:
      exposure:
        include:
          - polaris-discovery
          - health
