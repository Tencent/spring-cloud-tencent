server:
  port: 18081
#  servlet:
#    context-path: /api
spring:
  application:
    name: provider-demo
  cloud:
    polaris:
      namespace: default
      enabled: true
      stat:
        enabled: true
      loadbalancer:
        strategy: polarisWeightedRandom
    tencent:
      rpc-enhancement:
        reporter:
          enabled: true
      metadata:
        # 连接北极星且需要编解码 TSF-Tags 时设为 true（默认 false，有 tsf_consul_ip 时无需打开）
        # tsf-header-compatible: true

logging:
  file:
    name: /tsf-demo-logs/${spring.application.name}/root.log
  level:
    root: INFO
management:
  endpoints:
    web:
      exposure:
        include:
          - polaris-config
