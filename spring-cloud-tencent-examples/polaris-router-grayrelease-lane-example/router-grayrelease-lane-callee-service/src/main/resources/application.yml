server:
  port: 48093
spring:
  application:
    name: LaneCalleeService
  cloud:
    polaris:
      address: grpc://119.91.66.223:8091
      namespace: default
      enabled: true
      discovery:
        enabled: true
        register: true
      contract:
        exposure: true
        report:
          enabled: true
      admin:
        port: 28083
      stat:
        enabled: true
      #        pushgateway:
      #          enabled: true
      #          address: 127.0.0.1:9091
      config:
        address: grpc://119.91.66.223:8093
        auto-refresh: true
        groups:
          - name: ${spring.application.name}
            files: [ "config/callee.properties" ]
management:
  endpoints:
    web:
      exposure:
        include:
          - polaris-discovery
          - polaris-config